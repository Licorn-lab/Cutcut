<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CutCut · 本地图片工作台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div id="batchPage">
<header class="app-header"><div class="identity"><svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><path fill="currentColor" d="M3 5a4 4 0 0 1 6-3l5 4 5-4a4 4 0 0 1 6 3v18a4 4 0 0 1-6 3l-5-4-5 4a4 4 0 0 1-6-3z"/><path fill="white" d="m14 8 6 6-6 6-6-6z"/></svg><span class="brand">CutCut</span><span class="tag">本地图片工作台</span></div><div class="job-status"><span class="status-dot"></span><span id="job" role="status">准备就绪</span><progress id="progress" value="0" max="1" aria-label="处理进度"></progress><button id="stop">停止</button></div><button id="desktop" class="quiet">桌面版修整 ↗</button></header>
<main>
<details class="setup panel" open><summary><span>批次设置 <small>选择文件夹与导出参数</small></span><span class="disclosure">⌄</span></summary><div class="setup-body"><div class="folders"><label>原图文件夹<div class="inputrow"><input id="source" placeholder="选择原图文件夹"><button data-pick="source">选择</button></div></label><label>输出文件夹<div class="inputrow"><input id="destination" placeholder="可与其他批次共用，重名自动加序号"><button data-pick="destination">选择</button></div></label><button id="open">打开批次</button></div><div class="options"><label>批次模型<select id="model"><option value="u2net">快速 · U²-Net</option><option value="isnet-general-use">备用 · IS-Net</option><option value="birefnet-general">BiRefNet（较慢）</option></select></label><label>未裁剪图片的导出画布<select id="layout"><option value="original">保留原图尺寸</option><option value="square">统一正方形</option></select></label><label id="squareSizeOption" hidden>方图边长（px）<input id="size" type="number" min="256" max="6000" value="1500"></label><label id="squareOccupancyOption" hidden title="主体最长边占方图边长的比例；85% 会在两侧各留约 7.5% 的空白">主体填充（%）<input id="occupancy" type="number" min="50" max="95" value="85"></label><span id="squareHint" class="muted" hidden>主体填充控制留白：85% 时，两侧各留约 7.5%。</span><span class="muted">图片在本机处理 · 原图保留 · 确认后导出</span></div></div></details>
<div class="batch-strip"><div><span class="local-badge"><span class="status-dot"></span>本地处理</span><span id="count">打开批次后开始整理图片</span></div><span>整批抠图 → 大画布修整 → 确认导出</span></div>
<div id="error" role="alert"></div>
<section class="workspace"><aside class="panel library"><div class="listhead"><h2>图片队列</h2><select id="filter" aria-label="审核状态筛选"><option value="all">全部状态</option><option value="pending">待审核 / 未处理</option><option value="warning">存在程序提示</option><option value="approved">已通过</option><option value="redo">待返工</option><option value="failed">处理失败</option></select><button id="start" class="primary">本地抠图 / 继续</button><label class="restart-scope">换模范围<select id="restartScope"><option value="unapproved">仅未通过图片</option><option value="all">全部图片（含已通过）</option></select></label><button id="restart">整批换模重做</button></div><p class="queue-hint" id="batchHint">失败与有程序提示的图片优先展示</p><div id="items"></div><div class="pager"><button id="prev" aria-label="上一页">‹</button><span id="page"></span><button id="next" aria-label="下一页">›</button></div></aside><section id="editorPage" class="panel review" aria-label="图片审核与修整"><header class="editor-header"><div class="editor-title"><h1 class="editable-title"><input id="titleName" aria-label="本张导出名称，点击可修改" title="点击修改导出名称；原图文件名不变。Enter 完成，Esc 取消本次改名。" placeholder="选择图片开始审核" autocomplete="off" spellcheck="false" disabled><span id="titleExtension" aria-hidden="true"></span><svg class="rename-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m10.5 2.5 3 3M3 10l7.5-7.5a1.4 1.4 0 0 1 2 0l1 1a1.4 1.4 0 0 1 0 2L6 13l-4 1 1-4Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></h1><span id="editorPosition" class="muted"></span></div><div class="review-controls"><div class="image-navigation" role="group" aria-label="切换审核图片"><button id="previousImage" disabled>上一张</button><button id="nextImage" disabled>下一张</button></div><button id="focusMode">放大画布</button><button id="viewMode">仅看结果</button><div class="zoom-controls"><button id="zoomout" aria-label="缩小">−</button><button id="fit">适应</button><button id="zoomin" aria-label="放大">＋</button></div></div></header><div class="editbar"><label>操作<select id="editMode"><option value="pan">移动</option><option value="restore">恢复主体</option><option value="erase">擦除杂物 / 背景</option></select></label><label>选区<select id="editShape"><option value="brush">画笔</option><option value="lasso">套索</option><option value="rectangle">矩形</option><option value="polygon">多边形</option></select></label><label class="brush-size">半径（原图像素）<input id="radiusRange" aria-label="画笔半径滑块" type="range" min="1" max="1000" value="15"><input id="radius" aria-label="画笔半径，原图像素" type="number" min="1" max="1000" value="15"></label><button id="finishPolygon">应用多边形</button><button id="cancelSelection">取消选区</button><button id="undoEdit">撤销</button><button id="redoEdit">重做</button><button id="resetMask">重置蒙版</button><div class="composition-tools"><button id="startGeometry">旋转与校正</button><button id="startCrop">裁剪空白</button><button id="clearCrop" disabled>清除已保存裁剪</button></div></div>
<div class="utilitybar"><div class="retry-controls"><span>本张模型</span><select id="retryModel" aria-label="本张返工使用的模型"><option value="u2net">U²-Net</option><option value="isnet-general-use">IS-Net</option><option value="birefnet-general">BiRefNet（较慢）</option></select><button id="retry">本张换模重试</button></div><div class="background-controls"><label>背景<select id="backgroundMode" aria-label="本张导出背景"><option value="#ffffff">白色</option><option value="transparent">透明</option><option value="#438edb">蓝色</option><option value="#d84148">红色</option><option value="custom">自定义颜色</option></select></label><div id="customColorControls" class="custom-color-controls" hidden><label class="color-picker-label" title="点击色块打开调色盘"><input id="backgroundColor" type="color" value="#ffffff" aria-label="点击色块选择背景颜色"><span>选色</span></label><label class="hex-label">色值<input id="backgroundHex" type="text" value="#FFFFFF" maxlength="7" spellcheck="false" autocomplete="off" aria-label="自定义背景六位十六进制色值" placeholder="#RRGGBB"></label></div><span id="backgroundHint">纯色背景 · 导出 JPG</span></div></div><div id="cropToolbar" class="utilitybar crop-toolbar" hidden><span id="cropTools" class="crop-controls"><button id="resetCrop" disabled>重置裁剪框</button><label id="cropRatioLabel" class="ratio-label" hidden>比例<select id="cropRatio"><option value="free">自由裁剪</option><option value="original">原图比例</option><option value="1">1:1 · 方图</option><option value="0.75">3:4 · 竖版</option><option value="1.3333333333333333">4:3 · 横版</option><option value="0.6666666666666666">2:3 · 海报</option><option value="0.7071067811865475">A 系列 · 竖版海报</option><option value="0.5625">9:16 · 竖屏</option><option value="1.7777777777777777">16:9 · 横屏</option><option value="0.7142857142857143">5:7 · 寸照比例</option></select></label><span id="cropSizeInputs" class="crop-size-inputs" hidden><label>宽<input id="cropWidth" type="number" min="1" step="1" inputmode="numeric" aria-label="裁剪宽度（像素）"></label><span>×</span><label>高<input id="cropHeight" type="number" min="1" step="1" inputmode="numeric" aria-label="裁剪高度（像素）"></label><span>px</span></span><button id="saveCrop" disabled>确认裁剪</button><button id="cancelCrop" disabled>取消裁剪</button><output id="cropDimensions" aria-live="polite">尚未裁剪</output></span></div>
<section id="geometryPanel" class="geometry-panel" aria-label="图片旋转与透视校正" hidden><div class="geometry-heading"><div class="geometry-buttons"><button id="rotateImage" title="顺时针旋转90度">旋转 90°</button><button id="flipImage" aria-pressed="false">水平翻转</button><span id="geometrySummary"></span></div><div class="geometry-buttons"><button id="resetComposition">恢复初始构图</button><button id="resetGeometry">重置本次调整</button><button id="cancelGeometry">取消</button><button id="saveGeometry" class="primary">确认调整</button></div></div><div class="geometry-sliders"><label>角度微调<input id="angleRange" type="range" min="-45" max="45" step=".1" value="0" aria-label="角度微调"><span><input id="angleNumber" type="number" min="-45" max="45" step=".1" value="0" aria-label="角度微调数值">°</span></label><label>水平透视<input id="horizontalRange" type="range" min="-100" max="100" step="1" value="0" aria-label="水平透视"><span><input id="horizontalNumber" type="number" min="-100" max="100" step="1" value="0" aria-label="水平透视数值"></span></label><label>垂直透视<input id="verticalRange" type="range" min="-100" max="100" step="1" value="0" aria-label="垂直透视"><span><input id="verticalNumber" type="number" min="-100" max="100" step="1" value="0" aria-label="垂直透视数值"></span></label></div></section><div class="compare"><div class="original-pane"><span id="originalLabel">原图</span><div class="viewport" id="originalView"><img id="original" draggable="false" alt="原图"><canvas class="overlay" id="originalOverlay"></canvas></div></div><div class="result-pane"><span><span id="resultLabel">白底结果</span> <small>修整自动保存 · 人工确认后导出</small></span><div class="viewport" id="resultView"><img id="result" draggable="false" alt="抠图候选结果"><div id="geometryPreview" hidden aria-hidden="true"><canvas id="geometrySurface"></canvas></div><canvas class="overlay" id="resultOverlay"></canvas><div id="geometryGrid" class="geometry-grid" hidden aria-hidden="true"></div><div id="cropBox" hidden tabindex="0" role="group" aria-label="裁剪框，方向键移动，Shift 加方向键调整右下边缘"><i data-edge="nw"></i><i data-edge="ne"></i><i data-edge="sw"></i><i data-edge="se"></i><i data-edge="n"></i><i data-edge="s"></i><i data-edge="w"></i><i data-edge="e"></i></div><div id="noresult">尚未生成候选，请先在左侧开始抠图</div></div></div></div>
<div class="editor-status"><span id="editStatus" role="status">修整松手后自动保存；确认通过才导出。</span><button id="retrySave" hidden>重试保存修整</button><span id="imageDimensions"></span></div>
<footer class="review-footer"><div id="warnings" class="notice">程序提示仅供筛查，仍需人工复核。</div><div id="exportFeedback" class="export-feedback" hidden><span id="exportFeedbackLabel"></span><span id="exportPath"></span><button id="revealExport">在文件夹中显示</button></div><div class="export-naming"><label>导出命名<select id="naming"><option value="original">保留原文件名</option><option value="custom">自定义名称</option></select></label><input id="customName" aria-label="自定义导出名称" placeholder="输入图片名称，无需填写扩展名" hidden><output id="filenamePreview" aria-live="polite"></output></div><div class="actions"><input id="reason" aria-label="返工备注，仅写入返工文件名" placeholder="返工备注（仅返工文件名追加，选填）"><button id="redo">标记返工</button><button id="approve" class="primary">确认通过并导出</button></div></footer>
</section></section></main></div>
<div id="toast" role="status"></div><script src="/app.js"></script><script src="/edit.js"></script><script src="/geometry.js"></script></body></html>
